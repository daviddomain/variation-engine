<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="lab-wrapper">
    <section class="panel setup-panel">
      <h1>Audio Lab</h1>

      <form class="control-form">
        <label for="category">Category</label>
        <select id="category" name="category"></select>

        <label for="sample">Sample</label>
        <select id="sample" name="sample"></select>

        <label for="source-note">Source Note</label>
        <input id="source-note" name="source-note" type="text" placeholder="A4" autocomplete="off">

        <label for="seed">Seed</label>
        <input id="seed" name="seed" type="number" value="0" step="1">

        <button id="render-button" type="button" disabled>Render</button>
      </form>

      <div class="status-panel" role="status" aria-live="polite">
        Loading Audio Lab...
      </div>
    </section>

    <section class="panel parameters-panel">
      <h2>Render Variation Parameters</h2>
      <button id="reset-ranges" class="secondary-button" type="button" disabled>Reset to recipe defaults</button>

      <div id="slider-list" class="slider-list"></div>
    </section>

    <section class="panel analysis-panel">
      <h2>Analysis Preview</h2>
      <dl id="analysis-preview" class="analysis-preview">
        <div>
          <dt>Detected note</dt>
          <dd>-</dd>
        </div>
        <div>
          <dt>Pitch confidence</dt>
          <dd>-</dd>
        </div>
        <div>
          <dt>Suggested profile</dt>
          <dd>-</dd>
        </div>
        <div>
          <dt>Duration</dt>
          <dd>-</dd>
        </div>
        <div>
          <dt>Sample rate</dt>
          <dd>-</dd>
        </div>
        <div>
          <dt>Channels</dt>
          <dd>-</dd>
        </div>
      </dl>
    </section>

    <section class="panel output-panel">
      <h2>Rendered JSON Output</h2>
      <div id="output-dir" class="output-dir">Output directory: -</div>
      <textarea id="rendered-output" spellcheck="false" readonly></textarea>
      <div class="save-row">
        <button type="button" disabled>Save</button>
        <span>Every render run is saved automatically.</span>
      </div>
    </section>

    <section class="panel pads-panel">
      <h2>Round Robin Sample Pads</h2>
      <div class="pads-grid" aria-label="Round robin sample pads">
        <button type="button" disabled>RR 1</button>
        <button type="button" disabled>RR 2</button>
        <button type="button" disabled>RR 3</button>
        <button type="button" disabled>RR 4</button>
        <button type="button" disabled>RR 5</button>
        <button type="button" disabled>RR 6</button>
        <button type="button" disabled>RR 7</button>
        <button type="button" disabled>RR 8</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
